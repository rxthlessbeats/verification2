# Recorded trajectories are byte-exact source records.
exclude: ^data/trajectory/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Preserve native policies and fixture bytes.
      - id: trailing-whitespace
        exclude: ^(src/qera/resources/|tests/fixtures/)
      - id: end-of-file-fixer
        exclude: ^(src/qera/resources/|tests/fixtures/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
