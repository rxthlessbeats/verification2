repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 原始資料（τ² 官方 policy、測試用的真實 trajectory）必須逐字保留，不做空白清理
      - id: trailing-whitespace
        exclude: ^(src/qera/resources/|tests/fixtures/)
      - id: end-of-file-fixer
        exclude: ^(src/qera/resources/|tests/fixtures/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
