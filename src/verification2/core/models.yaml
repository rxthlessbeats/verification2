# Every model a role can use. Roles pick one by name (SOLVER_MODEL, JEV_MODEL and
# VERIFIER_MODEL in .env); endpoints, credentials and limits live here.
# Endpoints are keyed by API: the solver needs chat_completions, Jev needs
# systemone, and the verifier uses messages when listed, else chat_completions.
# reasoning_efforts lists the values SOLVER_REASONING_EFFORT and
# VERIFIER_REASONING_EFFORT may take for that model, and default_reasoning_effort is
# used when they are empty. none turns reasoning off; provider, or a model without
# listed efforts, sends no field and the provider decides.
# Limits and efforts come from the provider listings
# (https://opencode.ai/inference/go/v1/models, https://ai-gateway.vercel.sh/v1/models).

models:
  qwen3.8-flash:
    api_key_env: OPENCODE_API_KEY
    endpoints:
      chat_completions: https://opencode.ai/inference/go/openai/v1/chat/completions
      messages: https://opencode.ai/inference/go/anthropic/v1/messages
    max_output_tokens: 131072
    reasoning_efforts: [none, low, medium, xhigh]
    default_reasoning_effort: medium

  glm-5.3-flash:
    api_key_env: OPENCODE_API_KEY
    endpoints:
      chat_completions: https://opencode.ai/inference/go/openai/v1/chat/completions
    max_output_tokens: 131072
    # medium is accepted although the listing names only low, high and max.
    reasoning_efforts: [none, low, medium, high, max]
    default_reasoning_effort: medium

  typesafe-ai/jev:
    api_key_env: JEV_API_KEY
    endpoints:
      systemone: https://ai-gateway.vercel.sh/typesafe/v1/systemone
