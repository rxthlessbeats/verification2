[project]
name = "verification2"
version = "0.1.0"
description = "USC EE599 verification2"
readme = "README.md"
authors = [
    { name = "rxthlessbeats", email = "lutinyu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["verification2", "qera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: isolated logic with in-memory data or mocked transport",
    "integration: adapters, CLI, filesystem, subprocess or HTTP transport",
    "e2e: complete staged workflows with scripted model providers (no paid API calls)",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
    "pytest>=8",
]
