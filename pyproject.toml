[project]
name = "verification2"
version = "0.1.0"
description = "USC EE599 verification2"
readme = "README.md"
authors = [
    { name = "rxthlessbeats", email = "lutinyu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # ── qera（統一 Q/E/R/A 接口）需要的套件 ──
    "pydantic>=2.5",
    "tiktoken>=0.7",
    "dashscope>=1.20",  # 只用它內附的 Qwen BPE 詞表來算 token（不需要 API key）
    "openai>=1.40",     # 連自己架的 vLLM（OpenAI 相容接口）：scripts/run_solver.py、judge_bcp.py
]

[project.optional-dependencies]
qwen = ["transformers>=4.45"]  # 想用官方 Qwen tokenizer 時：export QERA_TOKENIZER=Qwen/Qwen3-32B

[project.scripts]
verification2 = "verification2:main"
qera = "qera.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/ 底下有兩個套件：verification2（pipeline）與 qera（統一接口）
module-name = ["verification2", "qera"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
    "pytest>=8",
]
