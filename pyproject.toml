[project]
name = "verification2"
version = "0.1.0"
description = "USC EE599 verification2"
readme = "README.md"
authors = [
    { name = "rxthlessbeats", email = "lutinyu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2",
    "tiktoken>=0.7",
]

[project.scripts]
verification2 = "verification2:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
